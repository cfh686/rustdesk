name: Build Custom RustDesk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source & pull submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject custom server & public key (PowerShell)
        run: |
          $filePath = "libs/hbb_common/src/config.rs"
          $rendezvousServer = "${{ secrets.RENDEZVOUS_SERVER }}"
          $rsPubKey = "${{ secrets.RS_PUB_KEY }}"
          $content = Get-Content $filePath -Raw
          
          $newRendezvous = "pub const RENDEZVOUS_SERVERS: &[&str] = &[""$rendezvousServer""];"
          $content = $content -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', $newRendezvous

          $newPubkey = "pub const RS_PUB_KEY: &str = ""$rsPubKey"";"
          $content = $content -replace 'pub const RS_PUB_KEY: &str = ".*";', $newPubkey
          
          Set-Content $filePath $content
          Get-Content $filePath
        shell: pwsh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows RustDesk
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-win-custom
          path: flutter/build/windows/x64/runner/Release/
