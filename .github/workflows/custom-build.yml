name: Build Custom RustDesk
on:
  workflow_dispatch: # 网页手动触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source & pull submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject custom server & public key
        run: |
          cd libs/hbb_common/src
          sed -i "s#pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];#pub const RENDEZVOUS_SERVERS: &[&str] = &[\"${{ secrets.RENDEZVOUS_SERVER }}\"];#g" config.rs || true
          sed -i "s#pub const RS_PUB_KEY: &str = \".*\";#pub const RS_PUB_KEY: &str = \"${{ secrets.RS_PUB_KEY }}\";#g" config.rs || true
        shell: bash

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libgtk-3-dev libssl-dev

      - name: Build RustDesk
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-win-custom
          path: flutter/build/windows/x64/runner/Release/
